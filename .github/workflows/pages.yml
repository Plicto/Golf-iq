name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths-ignore:
      - "labs/**"
      - "quality/**"
      - ".nojekyll"
      - ".preview/**"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy public demo + PR225 gate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out public demo
        uses: actions/checkout@v4

      - name: Materialize verified PR225 gate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/pr225-pages-public
          mkdir -p /tmp/pr225-pages-public
          curl --fail --location --retry 2 --silent --show-error 'https://sdmntprwestus.oaiusercontent.com/files/00000000-0d98-8230-bf61-8dee8d79e182/raw?se=2026-08-18T09%3A40%3A10Z&sp=r&sv=2026-02-06&sr=b&scid=8e13e286-52ff-5bdf-af41-87fde30897cc&skoid=a0b9f82a-c86e-4064-a822-2aa38890bb37&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-18T06%3A05%3A02Z&ske=2026-08-19T06%3A05%3A02Z&sks=b&skv=2026-02-06&sig=C9SrO4CVV2Ve14bmRsW%2B%2BgI36CVy6Km%2Bu9D7XoMJ9D0%3D' --output /tmp/pr225-pages-public.zip
          echo '98f236440ae97320fbfe250f098cb56f577bdfa7a5577be67bc8bedd15bec2a0  /tmp/pr225-pages-public.zip' | sha256sum --check --strict
          unzip -q /tmp/pr225-pages-public.zip -d /tmp/pr225-pages-public

          rm -rf labs quality
          cp -R /tmp/pr225-pages-public/labs ./labs
          cp -R /tmp/pr225-pages-public/quality ./quality
          printf '' > .nojekyll

          node <<'NODE'
          const fs = require('node:fs');
          const path = 'labs/renderer-visual-gate/renderer-visual-gate.js';
          let source = fs.readFileSync(path, 'utf8');
          const marker = 'const assertSourceResponse = (response, path) => {';
          if (!source.includes(marker)) throw new Error('visual gate response marker missing');
          source = source.replace(
            marker,
            'const PAGE_BASE = "/Golf-iq";\nconst hostedSourcePath = (path) => `${PAGE_BASE}${path}`;\n\n' + marker,
          );
          const responseCheck = 'new URL(response.url).pathname !== path';
          if (!source.includes(responseCheck)) throw new Error('visual gate response path check missing');
          source = source.replace(
            responseCheck,
            'new URL(response.url).pathname !== hostedSourcePath(path)',
          );
          const sourceUrl = 'const url = new URL(path, location.origin);';
          if (!source.includes(sourceUrl)) throw new Error('visual gate source URL marker missing');
          source = source.replace(
            sourceUrl,
            'const url = new URL(hostedSourcePath(path), location.origin);',
          );
          fs.writeFileSync(path, source);
          NODE

          grep -q 'pr225-safari-v4' labs/renderer-visual-gate/renderer-visual-gate-protocol.js
          grep -q 'faf1e3cc7d18598e76f5e8d2b692a10277994502142ce31f1c51c79154298053' labs/renderer-visual-gate/renderer-visual-gate-protocol.js
          grep -q 'watercourse-edge-and-surface-v2' labs/renderer-visual-gate/renderer-visual-gate-protocol.js
          test -f labs/renderer-evaluation/index.html
          test -f quality/renderer-source-manifest.v1.json

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add labs quality .nojekyll
          if ! git diff --cached --quiet; then
            git commit -m 'Materialize PR225 v4 visual gate [skip ci]'
            git push origin HEAD:main
          fi

      - name: Stage public site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp index.html _site/index.html
          cp .nojekyll _site/.nojekyll
          cp -R labs _site/labs
          cp -R quality _site/quality

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload staged site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Record verified live preview
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .preview
          cat > .preview/pr225-live.json <<JSON
          {
            "gateVersion": "pr225-safari-v4",
            "rendererSourceFingerprint": "faf1e3cc7d18598e76f5e8d2b692a10277994502142ce31f1c51c79154298053",
            "sourceHead": "785835b7ca7659b5b4df4cd722b5aa43e41db0ee",
            "artifactSha256": "98f236440ae97320fbfe250f098cb56f577bdfa7a5577be67bc8bedd15bec2a0",
            "materializedInPublicRepo": true,
            "pageUrl": "${PAGE_URL}",
            "visualGateUrl": "${PAGE_URL}labs/renderer-visual-gate/"
          }
          JSON
          git add .preview/pr225-live.json
          git commit -m 'Record materialized PR225 v4 preview [skip ci]'
          git push origin HEAD:main
