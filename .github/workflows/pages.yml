name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths-ignore:
      - "labs/**"
      - "quality/**"
      - ".nojekyll"
      - ".preview/**"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy materialized PR225 gate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out public demo
        uses: actions/checkout@v4

      - name: Verify materialized v7 identity
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'pr225-safari-v7' labs/renderer-visual-gate/renderer-visual-gate-protocol.js
          grep -q '19a4f8e055d53bccec6bc96a33270ec6392aecc1b8bffb820f451b35342b0677' labs/renderer-visual-gate/renderer-visual-gate-protocol.js
          grep -q 'watercourse-edge-and-surface-v5' labs/renderer-visual-gate/renderer-visual-gate-protocol.js
          grep -q 'vertices: 180' labs/renderer-visual-gate/renderer-visual-gate-protocol.js
          grep -q 'triangles: 180' labs/renderer-visual-gate/renderer-visual-gate-protocol.js
          grep -q 'bytes: 6_660' labs/renderer-visual-gate/renderer-visual-gate-protocol.js
          grep -q '19a4f8e055d53bccec6bc96a33270ec6392aecc1b8bffb820f451b35342b0677' quality/renderer-source-manifest.v1.json
          test -f labs/renderer-evaluation/index.html

      - name: Stage public site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp index.html _site/index.html
          cp .nojekyll _site/.nojekyll
          cp -R labs _site/labs
          cp -R quality _site/quality

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload staged site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify exact live v7 protocol
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          LIVE_URL="${PAGE_URL}labs/renderer-visual-gate/renderer-visual-gate-protocol.js"
          verified=false
          for attempt in $(seq 1 12); do
            if curl --fail --location --silent --show-error \
              "${LIVE_URL}?v=4274a5c-${GITHUB_RUN_ID}-${attempt}" \
              --output /tmp/pr225-v7-live-protocol.js; then
              if grep -q 'pr225-safari-v7' /tmp/pr225-v7-live-protocol.js \
                && grep -q '19a4f8e055d53bccec6bc96a33270ec6392aecc1b8bffb820f451b35342b0677' /tmp/pr225-v7-live-protocol.js \
                && grep -q 'watercourse-edge-and-surface-v5' /tmp/pr225-v7-live-protocol.js; then
                verified=true
                break
              fi
            fi
            sleep 5
          done
          test "$verified" = true
          grep -q 'vertices: 180' /tmp/pr225-v7-live-protocol.js
          grep -q 'triangles: 180' /tmp/pr225-v7-live-protocol.js
          grep -q 'bytes: 6_660' /tmp/pr225-v7-live-protocol.js

      - name: Record verified live preview
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .preview
          cat > .preview/pr225-live.json <<JSON
          {
            "gateVersion": "pr225-safari-v7",
            "rendererSourceFingerprint": "19a4f8e055d53bccec6bc96a33270ec6392aecc1b8bffb820f451b35342b0677",
            "sourceHead": "4274a5c21a1c555d234940599f1630f4844eeb89",
            "artifactSha256": "f52733c83765a1204561363ee185db120ca44627f947bacf23f5c0cd81ef91d0",
            "materializedInPublicRepo": true,
            "liveProtocolVerified": true,
            "pageUrl": "${PAGE_URL}",
            "visualGateUrl": "${PAGE_URL}labs/renderer-visual-gate/"
          }
          JSON
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .preview/pr225-live.json
          git commit -m 'Record live-verified PR225 v7 preview [skip ci]'
          git push origin HEAD:main
