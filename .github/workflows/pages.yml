name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths-ignore:
      - "labs/**"
      - "quality/**"
      - ".nojekyll"
      - ".preview/**"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy public demo + PR225 gate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out public demo
        uses: actions/checkout@v4

      - name: Materialize verified PR225 gate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/pr225-pages-public
          mkdir -p /tmp/pr225-pages-public
          curl --fail --location --retry 2 --silent --show-error 'https://sdmntprukwest.oaiusercontent.com/files/00000000-2eec-8243-88f3-3d857062ebb5/raw?se=2026-08-18T13%3A03%3A17Z&sp=r&sv=2026-02-06&sr=b&scid=2fd51015-a739-54df-a7f5-3fe439d72e77&skoid=a0b9f82a-c86e-4064-a822-2aa38890bb37&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-17T22%3A41%3A21Z&ske=2026-08-18T22%3A41%3A21Z&sks=b&skv=2026-02-06&sig=OEPXlbPYIzNjklxiI8s/xklnfSAQduwJv7iDvPEElZg%3D' --output /tmp/pr225-pages-public.zip
          echo 'e21ab22dab01d6019a3e533830d4584a960d049683bfffc57045001c8f4dafe9  /tmp/pr225-pages-public.zip' | sha256sum --check --strict
          unzip -q /tmp/pr225-pages-public.zip -d /tmp/pr225-pages-public

          rm -rf labs quality
          cp -R /tmp/pr225-pages-public/labs ./labs
          cp -R /tmp/pr225-pages-public/quality ./quality
          printf '' > .nojekyll

          node <<'NODE'
          const fs = require('node:fs');
          const path = 'labs/renderer-visual-gate/renderer-visual-gate.js';
          let source = fs.readFileSync(path, 'utf8');
          const marker = 'const assertSourceResponse = (response, path) => {';
          if (!source.includes(marker)) throw new Error('visual gate response marker missing');
          source = source.replace(
            marker,
            'const PAGE_BASE = "/Golf-iq";\nconst hostedSourcePath = (path) => `${PAGE_BASE}${path}`;\n\n' + marker,
          );
          const responseCheck = 'new URL(response.url).pathname !== path';
          if (!source.includes(responseCheck)) throw new Error('visual gate response path check missing');
          source = source.replace(
            responseCheck,
            'new URL(response.url).pathname !== hostedSourcePath(path)',
          );
          const sourceUrl = 'const url = new URL(path, location.origin);';
          if (!source.includes(sourceUrl)) throw new Error('visual gate source URL marker missing');
          source = source.replace(
            sourceUrl,
            'const url = new URL(hostedSourcePath(path), location.origin);',
          );
          fs.writeFileSync(path, source);
          NODE

          grep -q 'pr225-safari-v5' labs/renderer-visual-gate/renderer-visual-gate-protocol.js
          grep -q '2981b9e07013f26119666d68a7fec2403d8510dc43bf2b0267ebfe06f47a2ef5' labs/renderer-visual-gate/renderer-visual-gate-protocol.js
          grep -q 'watercourse-edge-and-surface-v3' labs/renderer-visual-gate/renderer-visual-gate-protocol.js
          test -f labs/renderer-evaluation/index.html
          test -f quality/renderer-source-manifest.v1.json

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add labs quality .nojekyll
          if ! git diff --cached --quiet; then
            git commit -m 'Materialize PR225 v5 visual gate [skip ci]'
            git push origin HEAD:main
          fi

      - name: Stage public site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp index.html _site/index.html
          cp .nojekyll _site/.nojekyll
          cp -R labs _site/labs
          cp -R quality _site/quality

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload staged site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Record verified live preview
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .preview
          cat > .preview/pr225-live.json <<JSON
          {
            "gateVersion": "pr225-safari-v5",
            "rendererSourceFingerprint": "2981b9e07013f26119666d68a7fec2403d8510dc43bf2b0267ebfe06f47a2ef5",
            "sourceHead": "08eeee5e30b083f84f53ff3f27f62539242393f9",
            "artifactSha256": "e21ab22dab01d6019a3e533830d4584a960d049683bfffc57045001c8f4dafe9",
            "materializedInPublicRepo": true,
            "pageUrl": "${PAGE_URL}",
            "visualGateUrl": "${PAGE_URL}labs/renderer-visual-gate/"
          }
          JSON
          git add .preview/pr225-live.json
          git commit -m 'Record materialized PR225 v5 preview [skip ci]'
          git push origin HEAD:main
