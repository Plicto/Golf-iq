name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths-ignore:
      - "labs/**"
      - "quality/**"
      - ".nojekyll"
      - ".preview/**"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy materialized PR225 gate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out public demo
        uses: actions/checkout@v4

      - name: Verify materialized v8 identity
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'pr225-safari-v8' labs/renderer-visual-gate/renderer-visual-gate-protocol.js
          grep -q '2112df9e80e0bcecb3cf177f424ea1ee2dbc5b804d150e03bcb44e92001fe45e' labs/renderer-visual-gate/renderer-visual-gate-protocol.js
          grep -q 'watercourse-edge-and-surface-v5' labs/renderer-visual-gate/renderer-visual-gate-protocol.js
          grep -q 'vertices: 176' labs/renderer-visual-gate/renderer-visual-gate-protocol.js
          grep -q 'triangles: 176' labs/renderer-visual-gate/renderer-visual-gate-protocol.js
          grep -q 'bytes: 6_512' labs/renderer-visual-gate/renderer-visual-gate-protocol.js
          grep -q '2112df9e80e0bcecb3cf177f424ea1ee2dbc5b804d150e03bcb44e92001fe45e' quality/renderer-source-manifest.v1.json
          test -f labs/course-presentation/webgl-watercourse-visual-v8.js
          test -f labs/renderer-evaluation/index.html

      - name: Stage public site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp index.html _site/index.html
          cp .nojekyll _site/.nojekyll
          cp -R labs _site/labs
          cp -R quality _site/quality
          SITE_ARTIFACT_SHA256="$(
            find _site -type f -print0 |
              sort -z |
              xargs -0 sha256sum |
              sha256sum |
              awk '{print $1}'
          )"
          echo "SITE_ARTIFACT_SHA256=$SITE_ARTIFACT_SHA256" >> "$GITHUB_ENV"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload staged site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify exact live v8 protocol
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          LIVE_URL="${PAGE_URL}labs/renderer-visual-gate/renderer-visual-gate-protocol.js"
          verified=false
          for attempt in $(seq 1 12); do
            if curl --fail --location --silent --show-error \
              "${LIVE_URL}?v=80441bb-${GITHUB_RUN_ID}-${attempt}" \
              --output /tmp/pr225-v8-live-protocol.js; then
              if grep -q 'pr225-safari-v8' /tmp/pr225-v8-live-protocol.js \
                && grep -q '2112df9e80e0bcecb3cf177f424ea1ee2dbc5b804d150e03bcb44e92001fe45e' /tmp/pr225-v8-live-protocol.js \
                && grep -q 'watercourse-edge-and-surface-v5' /tmp/pr225-v8-live-protocol.js; then
                verified=true
                break
              fi
            fi
            sleep 5
          done
          test "$verified" = true
          grep -q 'vertices: 176' /tmp/pr225-v8-live-protocol.js
          grep -q 'triangles: 176' /tmp/pr225-v8-live-protocol.js
          grep -q 'bytes: 6_512' /tmp/pr225-v8-live-protocol.js

      - name: Record verified live preview
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .preview
          cat > .preview/pr225-live.json <<JSON
          {
            "gateVersion": "pr225-safari-v8",
            "rendererSourceFingerprint": "2112df9e80e0bcecb3cf177f424ea1ee2dbc5b804d150e03bcb44e92001fe45e",
            "sourceHead": "80441bb2ab91936161cc29c2090f6f70117450ca",
            "materializedPublicHead": "9997be31303440d83ee72bcdb50526ad423b52ab",
            "artifactSha256": "${SITE_ARTIFACT_SHA256}",
            "materializedInPublicRepo": true,
            "liveProtocolVerified": true,
            "pageUrl": "${PAGE_URL}",
            "visualGateUrl": "${PAGE_URL}labs/renderer-visual-gate/"
          }
          JSON
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .preview/pr225-live.json
          git commit -m 'Record live-verified PR225 v8 preview [skip ci]'
          git push origin HEAD:main
