<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0a1712">
<meta name="color-scheme" content="dark">
<title>Golf IQ — PR 002</title>
<style>
:root {
  color-scheme: dark;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
  font-synthesis: none;
  text-rendering: optimizeLegibility;
  --ink: #f4f2e8;
  --muted: rgba(234, 237, 224, 0.62);
  --line: rgba(229, 235, 219, 0.12);
  --panel: rgba(15, 31, 25, 0.93);
  --panel-strong: #10261e;
  --accent: #e4b36f;
  --accent-dark: #8b6034;
  --green: #8eac77;
  background: #07110d;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body,
#app {
  width: 100%;
  min-height: 100%;
  margin: 0;
}

html {
  background: #07110d;
  overscroll-behavior: none;
}

body {
  min-height: 100dvh;
  overflow-x: hidden;
  background:
    radial-gradient(circle at 70% -10%, rgba(81, 115, 91, 0.24), transparent 42%),
    linear-gradient(180deg, #0b1c16 0%, #07110d 100%);
  color: var(--ink);
  user-select: none;
  -webkit-user-select: none;
}

button,
dialog {
  font: inherit;
}

button {
  color: inherit;
}

button:focus-visible {
  outline: 2px solid #f8d79d;
  outline-offset: 3px;
}

.app-shell {
  width: min(100%, 520px);
  min-height: 100dvh;
  margin: 0 auto;
  padding: max(18px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom));
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.brand-bar {
  min-height: 54px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}

.brand-bar h1,
.sheet-heading h2,
.result-sheet h2,
.about-dialog h2 {
  margin: 0;
  font-weight: 580;
  letter-spacing: -0.035em;
}

.brand-bar h1 {
  font-size: clamp(28px, 7vw, 36px);
  line-height: 0.96;
}

.eyebrow {
  margin: 0 0 5px;
  color: var(--muted);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.14em;
  line-height: 1.3;
  text-transform: uppercase;
}

.wind-badge {
  height: 42px;
  padding: 0 13px;
  display: flex;
  align-items: center;
  gap: 9px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: rgba(21, 41, 33, 0.78);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.035);
  color: rgba(245, 244, 235, 0.78);
  font-size: 12px;
}

.wind-badge strong {
  color: var(--ink);
  font-size: 14px;
}

.wind-arrow {
  display: inline-grid;
  width: 24px;
  height: 24px;
  place-items: center;
  border-radius: 50%;
  background: rgba(228, 179, 111, 0.12);
  color: var(--accent);
  font-size: 15px;
}

.scene-card {
  position: relative;
  min-height: clamp(245px, 37dvh, 360px);
  overflow: hidden;
  border: 1px solid rgba(230, 237, 220, 0.14);
  border-radius: 28px;
  background: #234338;
  box-shadow:
    0 28px 80px rgba(0, 0, 0, 0.3),
    inset 0 1px 0 rgba(255, 255, 255, 0.08);
}

.course-canvas {
  width: 100%;
  height: 100%;
  min-height: inherit;
  display: block;
}

.scene-vignette {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    linear-gradient(180deg, rgba(4, 15, 10, 0.16), transparent 30%, transparent 64%, rgba(5, 15, 11, 0.43)),
    radial-gradient(circle at center, transparent 38%, rgba(5, 16, 11, 0.25) 100%);
}

.hole-context {
  position: absolute;
  top: 14px;
  left: 14px;
  display: flex;
  gap: 6px;
}

.hole-context span {
  padding: 7px 10px;
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 999px;
  background: rgba(4, 18, 12, 0.45);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  color: rgba(255, 255, 255, 0.78);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.distance-lockup {
  position: absolute;
  right: 17px;
  bottom: 15px;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  text-shadow: 0 2px 14px rgba(0, 0, 0, 0.5);
}

.distance-value {
  font-size: clamp(48px, 14vw, 72px);
  font-weight: 300;
  letter-spacing: -0.07em;
  line-height: 0.82;
}

.distance-unit {
  margin-top: 9px;
  color: rgba(255, 255, 255, 0.72);
  font-size: 11px;
  font-weight: 650;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.decision-sheet,
.result-sheet {
  border: 1px solid var(--line);
  border-radius: 28px;
  background: linear-gradient(180deg, rgba(18, 39, 31, 0.96), rgba(11, 27, 21, 0.98));
  box-shadow:
    0 22px 70px rgba(0, 0, 0, 0.26),
    inset 0 1px 0 rgba(255, 255, 255, 0.035);
}

.decision-sheet {
  padding: 18px;
}

.sheet-heading {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 20px;
}

.sheet-heading h2,
.result-sheet h2,
.about-dialog h2 {
  font-size: 26px;
  line-height: 1.06;
}

.info-button,
.dialog-close {
  border: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.035);
  color: var(--muted);
}

.info-button {
  width: 36px;
  height: 36px;
  border-radius: 50%;
}

.control-block {
  margin-top: 16px;
}

.control-block.compact {
  min-width: 0;
}

.control-label-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 12px;
  margin-bottom: 9px;
}

.control-label {
  display: block;
  margin-bottom: 9px;
  color: rgba(245, 245, 237, 0.84);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.04em;
}

.control-label-row .control-label {
  margin: 0;
}

.control-value {
  color: var(--muted);
  font-size: 11px;
}

.club-strip {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
}

.club-button,
.choice-button {
  min-height: 44px;
  border: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.025);
  transition: border-color 160ms ease, background 160ms ease, transform 120ms ease, color 160ms ease;
}

.club-button:active,
.choice-button:active,
.commit-button:active,
.secondary-button:active {
  transform: scale(0.98);
}

.club-button {
  min-height: 58px;
  padding: 10px 8px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 4px;
  border-radius: 16px;
}

.club-button span {
  font-size: 13px;
  font-weight: 680;
}

.club-button small {
  color: var(--muted);
  font-size: 10px;
}

.club-button.is-selected,
.choice-button.is-selected {
  border-color: rgba(230, 188, 126, 0.58);
  background: linear-gradient(180deg, rgba(228, 179, 111, 0.19), rgba(228, 179, 111, 0.08));
  color: #ffefd1;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
}

.control-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.segmented-control {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 6px;
}

.choice-button {
  padding: 0 6px;
  border-radius: 14px;
  color: var(--muted);
  font-size: 11px;
  font-weight: 700;
}

.decision-note {
  min-height: 38px;
  margin: 14px 0 13px;
  padding: 11px 12px;
  display: flex;
  align-items: flex-start;
  gap: 10px;
  border: 1px solid rgba(142, 172, 119, 0.14);
  border-radius: 15px;
  background: rgba(142, 172, 119, 0.06);
  color: rgba(232, 237, 225, 0.67);
  font-size: 11px;
  line-height: 1.45;
}

.decision-dot {
  flex: 0 0 auto;
  width: 7px;
  height: 7px;
  margin-top: 4px;
  border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 12px rgba(142, 172, 119, 0.6);
}

.commit-button,
.secondary-button {
  width: 100%;
  min-height: 56px;
  border-radius: 18px;
  font-weight: 760;
  letter-spacing: -0.01em;
}

.commit-button {
  padding: 0 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border: 1px solid rgba(255, 224, 175, 0.32);
  background: linear-gradient(135deg, #d69a55, #e6bd7c);
  color: #1c160f;
  box-shadow:
    0 12px 30px rgba(194, 126, 61, 0.18),
    inset 0 1px 0 rgba(255, 255, 255, 0.35);
}

.commit-button:disabled {
  opacity: 0.72;
}

.result-sheet {
  padding: 22px;
  animation: rise-in 300ms cubic-bezier(0.22, 0.8, 0.28, 1);
}

.result-sheet > p:not(.eyebrow) {
  margin: 12px 0 20px;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.55;
}

.result-stats {
  margin: 0 0 18px;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 16px;
}

.result-stats div {
  min-width: 0;
  padding: 12px 10px;
  border-right: 1px solid var(--line);
}

.result-stats div:last-child {
  border-right: 0;
}

.result-stats dt {
  margin-bottom: 5px;
  color: var(--muted);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.result-stats dd {
  margin: 0;
  overflow: hidden;
  color: var(--ink);
  font-size: 13px;
  font-weight: 700;
  text-overflow: ellipsis;
}

.secondary-button {
  border: 1px solid rgba(228, 179, 111, 0.28);
  background: rgba(228, 179, 111, 0.08);
  color: #f4d8ac;
}

.about-dialog {
  width: min(calc(100% - 32px), 440px);
  padding: 26px;
  border: 1px solid rgba(232, 235, 222, 0.16);
  border-radius: 24px;
  background: #10271f;
  color: var(--ink);
  box-shadow: 0 40px 100px rgba(0, 0, 0, 0.55);
}

.about-dialog::backdrop {
  background: rgba(2, 9, 6, 0.72);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}

.about-dialog p:not(.eyebrow) {
  margin: 14px 0 0;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.6;
}

.dialog-close {
  position: absolute;
  top: 14px;
  right: 14px;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  font-size: 20px;
}

[hidden] {
  display: none !important;
}

@keyframes rise-in {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

@media (max-width: 359px) {
  .control-grid {
    grid-template-columns: 1fr;
    gap: 0;
  }
}

@media (max-height: 740px) {
  .app-shell {
    gap: 10px;
  }

  .scene-card {
    min-height: 220px;
  }

  .decision-sheet {
    padding: 17px;
  }

  .sheet-heading {
    margin-bottom: 12px;
  }

  .control-block {
    margin-top: 11px;
  }

  .decision-note {
    margin: 13px 0 12px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    transition-duration: 0.01ms !important;
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
  }
}

</style>
</head>
<body>
<div id="app">
  <main class="app-shell" aria-label="Golf IQ preview fallback">
    <header class="brand-bar">
      <div>
        <p class="eyebrow">PR 002 · Preview</p>
        <h1>Golf IQ</h1>
      </div>
      <div class="wind-badge"><span class="wind-arrow">↗</span><span><strong>5.2</strong> m/s</span></div>
    </header>

    <section class="scene-card" aria-label="Static golf-hole preview">
      <svg viewBox="0 0 520 340" role="img" aria-label="Stylised golf hole" style="width:100%;height:100%;display:block" preserveAspectRatio="xMidYMid slice">
        <defs>
          <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8eac9c"/><stop offset="1" stop-color="#38594b"/></linearGradient>
          <linearGradient id="fairway" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9eb37d"/><stop offset="1" stop-color="#456e50"/></linearGradient>
        </defs>
        <rect width="520" height="340" fill="url(#sky)"/>
        <path d="M0 155 C90 120 150 150 230 126 C330 96 430 126 520 96 L520 340 L0 340 Z" fill="#284f3f"/>
        <path d="M250 340 C205 280 210 236 265 205 C320 174 360 164 392 151 C420 168 397 206 355 229 C327 245 323 288 365 340 Z" fill="url(#fairway)"/>
        <path d="M0 265 C70 252 125 266 184 300 L164 340 L0 340 Z" fill="#2c6268"/>
        <ellipse cx="382" cy="158" rx="78" ry="25" fill="#a7bc7d" transform="rotate(-4 382 158)"/>
        <ellipse cx="436" cy="198" rx="45" ry="16" fill="#ccb98e" transform="rotate(-16 436 198)"/>
        <line x1="392" y1="177" x2="392" y2="113" stroke="#f5efe1" stroke-width="3"/>
        <path d="M392 113 L438 124 L392 136 Z" fill="#e3a65e"/>
        <g fill="#244b3d"><circle cx="72" cy="150" r="35"/><circle cx="125" cy="133" r="42"/><circle cx="470" cy="132" r="45"/></g>
      </svg>
      <div class="scene-vignette"></div>
      <div class="hole-context"><span>Hole 4</span><span>Par 4</span><span>Shot 2</span></div>
      <div class="distance-lockup"><span class="distance-value">156</span><span class="distance-unit">metres to pin</span></div>
    </section>

    <section class="decision-sheet">
      <div class="sheet-heading">
        <div>
          <p class="eyebrow">Static file preview</p>
          <h2>JavaScript is blocked here</h2>
        </div>
      </div>
      <p style="margin:0;color:var(--muted);line-height:1.55">Publish this file through an HTTPS web host such as GitHub Pages to run the interactive prototype. The hosted page replaces this message automatically.</p>
    </section>
  </main>
</div>
<noscript>Golf IQ requires JavaScript.</noscript>
<script>
const clubCarry = {
    '7i': 154,
    '6i': 166,
    '5i': 178
};
const shapeLateral = {
    fade: 4.8,
    straight: 0,
    draw: -4.1
};
const intentCarry = {
    safe: 0.965,
    stock: 1,
    attack: 1.025
};
function hashChoice(choice) {
    const value = `${choice.club}:${choice.shape}:${choice.intent}:pr001`;
    let hash = 2166136261;
    for (const character of value) {
        hash ^= character.charCodeAt(0);
        hash = Math.imul(hash, 16777619);
    }
    return hash >>> 0;
}
function seededUnit(seed) {
    let value = seed + 0x6d2b79f5;
    value = Math.imul(value ^ (value >>> 15), value | 1);
    value ^= value + Math.imul(value ^ (value >>> 7), value | 61);
    return ((value ^ (value >>> 14)) >>> 0) / 4294967296;
}
function calculatePrototypeShot(choice) {
    const seed = hashChoice(choice);
    const noiseA = seededUnit(seed) - 0.5;
    const noiseB = seededUnit(seed ^ 0x9e3779b9) - 0.5;
    const windCarry = 1.8;
    const windLateral = 2.7;
    const intentNoise = choice.intent === 'safe' ? 0.45 : choice.intent === 'attack' ? 1.3 : 0.8;
    const carryMeters = clubCarry[choice.club] * intentCarry[choice.intent] + windCarry + noiseA * 5 * intentNoise;
    const lateralMeters = shapeLateral[choice.shape] + windLateral + noiseB * 6 * intentNoise;
    const targetCarry = 156;
    const targetLateral = 1.2;
    const pinDistanceMeters = Math.hypot(carryMeters - targetCarry, lateralMeters - targetLateral);
    let quality;
    let headline;
    let detail;
    if (pinDistanceMeters <= 3) {
        quality = 'inside-three';
        headline = 'Inside three metres';
        detail = 'The choice matched the quartering wind and used the full green depth.';
    }
    else if (pinDistanceMeters <= 10) {
        quality = 'green';
        headline = 'Green in regulation';
        detail = carryMeters < targetCarry
            ? 'A controlled miss finished below the hole.'
            : 'The ball used the back section without bringing the bunker into play.';
    }
    else if (pinDistanceMeters <= 16) {
        quality = 'fringe';
        headline = 'Playable leave';
        detail = 'The result preserved par, but the chosen window left little margin.';
    }
    else {
        quality = 'miss';
        headline = 'Recovery required';
        detail = carryMeters > targetCarry
            ? 'The extra club carried beyond the useful landing shelf.'
            : 'The shot finished short of the green complex.';
    }
    return {
        seed,
        carryMeters,
        lateralMeters,
        pinDistanceMeters,
        quality,
        headline,
        detail,
        normalizedLandingX: Math.max(0.12, Math.min(0.88, 0.5 + lateralMeters / 38)),
        normalizedLandingY: Math.max(0.18, Math.min(0.82, 0.55 - (carryMeters - targetCarry) / 70))
    };
}

const clamp = (value, minimum, maximum) => Math.max(minimum, Math.min(maximum, value));
function createCourseCanvas(canvas) {
    const context = canvas.getContext('2d');
    if (!context) {
        throw new Error('Canvas 2D is unavailable.');
    }
    let width = 0;
    let height = 0;
    let pixelRatio = 1;
    let animationFrame = 0;
    let shotProgress = null;
    let activeResult = null;
    let resolveShot = null;
    let startTime = 0;
    let lastTime = performance.now();
    let breeze = 0;
    const resize = () => {
        const rectangle = canvas.getBoundingClientRect();
        pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
        width = Math.max(1, rectangle.width);
        height = Math.max(1, rectangle.height);
        canvas.width = Math.round(width * pixelRatio);
        canvas.height = Math.round(height * pixelRatio);
        context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
    };
    const roundedPath = (points) => {
        if (points.length < 2) {
            return;
        }
        context.beginPath();
        context.moveTo(points[0]?.x ?? 0, points[0]?.y ?? 0);
        for (let index = 1; index < points.length - 1; index += 1) {
            const point = points[index];
            const next = points[index + 1];
            if (point && next) {
                context.quadraticCurveTo(point.x, point.y, (point.x + next.x) / 2, (point.y + next.y) / 2);
            }
        }
        const finalPoint = points.at(-1);
        if (finalPoint) {
            context.lineTo(finalPoint.x, finalPoint.y);
        }
        context.closePath();
    };
    const ellipse = (x, y, radiusX, radiusY, rotation = 0) => {
        context.beginPath();
        context.ellipse(x, y, radiusX, radiusY, rotation, 0, Math.PI * 2);
    };
    const drawScene = (time) => {
        const dt = Math.min(0.05, (time - lastTime) / 1000);
        lastTime = time;
        breeze += dt;
        const sky = context.createLinearGradient(0, 0, 0, height);
        sky.addColorStop(0, '#8aa6a0');
        sky.addColorStop(0.48, '#b6c2ad');
        sky.addColorStop(1, '#d7c7a5');
        context.fillStyle = sky;
        context.fillRect(0, 0, width, height);
        const glow = context.createRadialGradient(width * 0.78, height * 0.16, 0, width * 0.78, height * 0.16, width * 0.48);
        glow.addColorStop(0, 'rgba(255, 235, 183, 0.6)');
        glow.addColorStop(1, 'rgba(255, 235, 183, 0)');
        context.fillStyle = glow;
        context.fillRect(0, 0, width, height * 0.7);
        context.fillStyle = '#496b5e';
        roundedPath([
            { x: -width * 0.1, y: height * 0.42 },
            { x: width * 0.18, y: height * 0.30 },
            { x: width * 0.44, y: height * 0.39 },
            { x: width * 0.7, y: height * 0.27 },
            { x: width * 1.1, y: height * 0.39 },
            { x: width * 1.1, y: height * 0.66 },
            { x: -width * 0.1, y: height * 0.66 }
        ]);
        context.fill();
        const land = context.createLinearGradient(0, height * 0.35, 0, height);
        land.addColorStop(0, '#486f55');
        land.addColorStop(1, '#183c31');
        context.fillStyle = land;
        roundedPath([
            { x: -width * 0.12, y: height * 0.54 },
            { x: width * 0.17, y: height * 0.44 },
            { x: width * 0.55, y: height * 0.50 },
            { x: width * 0.83, y: height * 0.41 },
            { x: width * 1.12, y: height * 0.53 },
            { x: width * 1.12, y: height * 1.1 },
            { x: -width * 0.12, y: height * 1.1 }
        ]);
        context.fill();
        const fairway = context.createLinearGradient(0, height * 0.5, 0, height);
        fairway.addColorStop(0, '#8ca777');
        fairway.addColorStop(1, '#456e50');
        context.fillStyle = fairway;
        roundedPath([
            { x: width * 0.48, y: height * 1.04 },
            { x: width * 0.35, y: height * 0.84 },
            { x: width * 0.42, y: height * 0.66 },
            { x: width * 0.57, y: height * 0.55 },
            { x: width * 0.69, y: height * 0.48 },
            { x: width * 0.82, y: height * 0.54 },
            { x: width * 0.70, y: height * 0.69 },
            { x: width * 0.65, y: height * 0.88 },
            { x: width * 0.72, y: height * 1.04 }
        ]);
        context.fill();
        context.fillStyle = '#ccb98e';
        ellipse(width * 0.76, height * 0.61, width * 0.095, height * 0.047, -0.28);
        context.fill();
        context.fillStyle = 'rgba(87, 64, 39, 0.24)';
        ellipse(width * 0.75, height * 0.617, width * 0.072, height * 0.025, -0.28);
        context.fill();
        const water = context.createLinearGradient(width * 0.05, height * 0.75, width * 0.35, height);
        water.addColorStop(0, '#416f74');
        water.addColorStop(1, '#183f48');
        context.fillStyle = water;
        roundedPath([
            { x: -width * 0.05, y: height * 0.72 },
            { x: width * 0.20, y: height * 0.69 },
            { x: width * 0.37, y: height * 0.80 },
            { x: width * 0.32, y: height * 1.05 },
            { x: -width * 0.05, y: height * 1.05 }
        ]);
        context.fill();
        context.save();
        context.globalAlpha = 0.18;
        context.strokeStyle = '#d9f2e6';
        context.lineWidth = 1;
        for (let index = 0; index < 7; index += 1) {
            const y = height * (0.78 + index * 0.027);
            const offset = Math.sin(breeze * 1.4 + index) * width * 0.015;
            context.beginPath();
            context.moveTo(width * 0.02 + offset, y);
            context.quadraticCurveTo(width * 0.18 + offset, y - 4, width * 0.32 + offset, y + 1);
            context.stroke();
        }
        context.restore();
        const greenX = width * 0.67;
        const greenY = height * 0.50;
        context.fillStyle = '#a7bc7d';
        ellipse(greenX, greenY, width * 0.16, height * 0.075, -0.06);
        context.fill();
        context.strokeStyle = 'rgba(223, 239, 181, 0.3)';
        context.lineWidth = 1;
        ellipse(greenX, greenY, width * 0.135, height * 0.058, -0.06);
        context.stroke();
        const flagX = width * 0.69;
        const flagY = height * 0.47;
        context.strokeStyle = '#f5efe1';
        context.lineWidth = Math.max(1.2, width * 0.004);
        context.beginPath();
        context.moveTo(flagX, flagY + height * 0.065);
        context.lineTo(flagX, flagY - height * 0.105);
        context.stroke();
        const flutter = Math.sin(breeze * 3) * width * 0.009;
        context.fillStyle = '#e3a65e';
        context.beginPath();
        context.moveTo(flagX, flagY - height * 0.103);
        context.lineTo(flagX + width * 0.085 + flutter, flagY - height * 0.078);
        context.lineTo(flagX, flagY - height * 0.047);
        context.closePath();
        context.fill();
        const treePositions = [
            [0.08, 0.48, 0.72], [0.20, 0.43, 0.9], [0.89, 0.43, 0.86], [0.94, 0.56, 1.08], [0.31, 0.51, 0.55]
        ];
        for (const [x, y, scale] of treePositions) {
            const sway = Math.sin(breeze * 1.1 + x * 12) * width * 0.003;
            context.fillStyle = '#674d37';
            context.fillRect(width * x - width * 0.006, height * y, width * 0.012, height * 0.09 * scale);
            context.fillStyle = '#244b3d';
            ellipse(width * x + sway, height * y, width * 0.052 * scale, height * 0.082 * scale);
            context.fill();
            context.fillStyle = 'rgba(126, 158, 109, 0.35)';
            ellipse(width * x - width * 0.012 + sway, height * y - height * 0.017, width * 0.033 * scale, height * 0.045 * scale);
            context.fill();
        }
        if (shotProgress !== null && activeResult) {
            const start = { x: width * 0.56, y: height * 0.94 };
            const end = {
                x: width * activeResult.normalizedLandingX,
                y: height * activeResult.normalizedLandingY
            };
            const control = {
                x: (start.x + end.x) / 2 + (end.x - start.x) * 0.08,
                y: Math.min(start.y, end.y) - height * 0.42
            };
            const t = clamp(shotProgress, 0, 1);
            const inverse = 1 - t;
            const ballX = inverse * inverse * start.x + 2 * inverse * t * control.x + t * t * end.x;
            const ballY = inverse * inverse * start.y + 2 * inverse * t * control.y + t * t * end.y;
            const shadowProgress = clamp((t - 0.6) / 0.4, 0, 1);
            context.fillStyle = `rgba(5, 20, 15, ${0.18 * shadowProgress})`;
            ellipse(end.x, end.y + height * 0.012, width * (0.008 + shadowProgress * 0.015), height * 0.007);
            context.fill();
            context.save();
            context.shadowColor = 'rgba(255, 251, 225, 0.9)';
            context.shadowBlur = width * 0.035;
            context.fillStyle = '#fffdf3';
            ellipse(ballX, ballY, Math.max(3, width * 0.010), Math.max(3, width * 0.010));
            context.fill();
            context.restore();
            if (t >= 1) {
                context.strokeStyle = 'rgba(255, 244, 207, 0.78)';
                context.lineWidth = 1.5;
                ellipse(end.x, end.y, width * 0.026, width * 0.026);
                context.stroke();
            }
        }
        animationFrame = requestAnimationFrame(drawScene);
    };
    const animateShot = (time) => {
        const elapsed = time - startTime;
        const duration = 1900;
        const raw = clamp(elapsed / duration, 0, 1);
        shotProgress = 1 - Math.pow(1 - raw, 3);
        if (raw < 1) {
            requestAnimationFrame(animateShot);
            return;
        }
        shotProgress = 1;
        const complete = resolveShot;
        resolveShot = null;
        window.setTimeout(() => complete?.(), 260);
    };
    const observer = new ResizeObserver(resize);
    observer.observe(canvas);
    resize();
    animationFrame = requestAnimationFrame(drawScene);
    return {
        play(result) {
            activeResult = result;
            shotProgress = 0;
            startTime = performance.now();
            return new Promise((resolve) => {
                resolveShot = resolve;
                requestAnimationFrame(animateShot);
            });
        },
        reset() {
            activeResult = null;
            shotProgress = null;
            resolveShot = null;
        },
        destroy() {
            observer.disconnect();
            cancelAnimationFrame(animationFrame);
            resolveShot = null;
        }
    };
}

const clubOptions = [
    { id: '7i', label: '7 iron', carry: '154 m' },
    { id: '6i', label: '6 iron', carry: '166 m' },
    { id: '5i', label: '5 iron', carry: '178 m' }
];
const shapeOptions = [
    { id: 'fade', label: 'Fade' },
    { id: 'straight', label: 'Straight' },
    { id: 'draw', label: 'Draw' }
];
const intentOptions = [
    { id: 'safe', label: 'Safe' },
    { id: 'stock', label: 'Stock' },
    { id: 'attack', label: 'Attack' }
];
function optionButtons(name, options, selected) {
    return options.map((option) => `
    <button
      class="choice-button${option.id === selected ? ' is-selected' : ''}"
      type="button"
      data-choice-group="${name}"
      data-choice-value="${option.id}"
      aria-pressed="${option.id === selected ? 'true' : 'false'}"
    >${option.label}</button>
  `).join('');
}
function createGolfIqApp(root) {
    let choice = { club: '7i', shape: 'fade', intent: 'stock' };
    let isPlaying = false;
    root.innerHTML = `
    <main class="app-shell">
      <header class="brand-bar">
        <div>
          <p class="eyebrow">PR 002 · Product charter locked</p>
          <h1>Golf IQ</h1>
        </div>
        <div class="wind-badge" aria-label="Wind 5.2 metres per second from the lower left">
          <span class="wind-arrow" aria-hidden="true">↗</span>
          <span><strong>5.2</strong> m/s</span>
        </div>
      </header>

      <section class="scene-card" aria-label="Golf hole preview">
        <canvas class="course-canvas" aria-hidden="true"></canvas>
        <div class="scene-vignette"></div>
        <div class="hole-context">
          <span>Hole 4</span>
          <span>Par 4</span>
          <span>Shot 2</span>
        </div>
        <div class="distance-lockup">
          <span class="distance-value">156</span>
          <span class="distance-unit">metres to pin</span>
        </div>
      </section>

      <section class="decision-sheet" aria-labelledby="decision-title">
        <div class="sheet-heading">
          <div>
            <p class="eyebrow">Quartering wind · back-right pin</p>
            <h2 id="decision-title">Choose the shot</h2>
          </div>
          <button class="info-button" type="button" data-action="about" aria-label="About this prototype">i</button>
        </div>

        <div class="control-block">
          <div class="control-label-row">
            <span class="control-label">Club</span>
            <span class="control-value" data-club-carry>154 m stock carry</span>
          </div>
          <div class="club-strip" role="group" aria-label="Club">
            ${clubOptions.map((option) => `
              <button
                class="club-button${option.id === choice.club ? ' is-selected' : ''}"
                type="button"
                data-choice-group="club"
                data-choice-value="${option.id}"
                aria-pressed="${option.id === choice.club ? 'true' : 'false'}"
              >
                <span>${option.label}</span>
                <small>${option.carry}</small>
              </button>
            `).join('')}
          </div>
        </div>

        <div class="control-grid">
          <div class="control-block compact">
            <span class="control-label">Shape</span>
            <div class="segmented-control" role="group" aria-label="Shot shape">
              ${optionButtons('shape', shapeOptions, choice.shape)}
            </div>
          </div>

          <div class="control-block compact">
            <span class="control-label">Intent</span>
            <div class="segmented-control" role="group" aria-label="Shot intent">
              ${optionButtons('intent', intentOptions, choice.intent)}
            </div>
          </div>
        </div>

        <div class="decision-note">
          <span class="decision-dot"></span>
          <span data-decision-note>A stock fade starts at the safe centre and works with the wind.</span>
        </div>

        <button class="commit-button" type="button" data-action="play">
          <span>Commit to shot</span>
          <span aria-hidden="true">→</span>
        </button>
      </section>

      <section class="result-sheet" data-result hidden aria-live="polite">
        <p class="eyebrow">Deterministic prototype result</p>
        <h2 data-result-headline></h2>
        <p data-result-detail></p>
        <dl class="result-stats">
          <div><dt>Carry</dt><dd data-result-carry></dd></div>
          <div><dt>Pin</dt><dd data-result-pin></dd></div>
          <div><dt>Seed</dt><dd data-result-seed></dd></div>
        </dl>
        <button class="secondary-button" type="button" data-action="reset">Play the decision again</button>
      </section>

      <dialog class="about-dialog" data-about-dialog>
        <button class="dialog-close" type="button" data-action="close-about" aria-label="Close">×</button>
        <p class="eyebrow">Product baseline</p>
        <h2>This is not the final golf model.</h2>
        <p>PR 002 locks the audience, player promise, launch scope, premium commercial model, success gates, and product constraints. This interaction remains the PR 001 non-production smoke test; production 3D and golf physics arrive later.</p>
      </dialog>
    </main>
  `;
    const canvas = root.querySelector('.course-canvas');
    const decisionSheet = root.querySelector('.decision-sheet');
    const resultSheet = root.querySelector('[data-result]');
    const playButton = root.querySelector('[data-action="play"]');
    const carryLabel = root.querySelector('[data-club-carry]');
    const decisionNote = root.querySelector('[data-decision-note]');
    const dialog = root.querySelector('[data-about-dialog]');
    if (!canvas || !decisionSheet || !resultSheet || !playButton || !carryLabel || !decisionNote || !dialog) {
        throw new Error('The application shell is incomplete.');
    }
    const course = createCourseCanvas(canvas);
    const notes = {
        fade: 'A controlled fade starts at the safe centre and works with the quartering wind.',
        straight: 'A straight ball removes shape compensation but leaves less room on the right.',
        draw: 'A draw fights the wind, increasing the chance of a left-side miss.'
    };
    const updateChoiceUi = () => {
        root.querySelectorAll('[data-choice-group]').forEach((button) => {
            const group = button.dataset.choiceGroup;
            const value = button.dataset.choiceValue;
            const selected = group !== undefined && value === choice[group];
            button.classList.toggle('is-selected', selected);
            button.setAttribute('aria-pressed', String(selected));
        });
        const selectedClub = clubOptions.find((option) => option.id === choice.club);
        carryLabel.textContent = `${selectedClub?.carry ?? '—'} stock carry`;
        decisionNote.textContent = notes[choice.shape];
    };
    root.addEventListener('click', async (event) => {
        const target = event.target instanceof Element ? event.target.closest('button') : null;
        if (!target) {
            return;
        }
        const group = target.dataset.choiceGroup;
        const value = target.dataset.choiceValue;
        if (group && value && !isPlaying) {
            choice = { ...choice, [group]: value };
            updateChoiceUi();
            return;
        }
        const action = target.dataset.action;
        if (action === 'about') {
            dialog.showModal();
            return;
        }
        if (action === 'close-about') {
            dialog.close();
            return;
        }
        if (action === 'reset') {
            resultSheet.hidden = true;
            decisionSheet.hidden = false;
            course.reset();
            return;
        }
        if (action !== 'play' || isPlaying) {
            return;
        }
        isPlaying = true;
        playButton.disabled = true;
        playButton.querySelector('span').textContent = 'Shot in flight';
        const result = calculatePrototypeShot(choice);
        await course.play(result);
        root.querySelector('[data-result-headline]').textContent = result.headline;
        root.querySelector('[data-result-detail]').textContent = result.detail;
        root.querySelector('[data-result-carry]').textContent = `${result.carryMeters.toFixed(1)} m`;
        root.querySelector('[data-result-pin]').textContent = `${result.pinDistanceMeters.toFixed(1)} m`;
        root.querySelector('[data-result-seed]').textContent = result.seed.toString(16).toUpperCase();
        decisionSheet.hidden = true;
        resultSheet.hidden = false;
        playButton.disabled = false;
        playButton.querySelector('span').textContent = 'Commit to shot';
        isPlaying = false;
    });
    window.addEventListener('pagehide', () => course.destroy(), { once: true });
}

const root = document.querySelector('#app');
if (!root) {
    throw new Error('Application root was not found.');
}
createGolfIqApp(root);
if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
    window.addEventListener('load', () => {
        void navigator.serviceWorker.register('./sw.js').catch(() => undefined);
    });
}
</script>
</body>
</html>
